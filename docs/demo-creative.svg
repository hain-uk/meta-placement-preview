<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Neutral vertical demo creative</title>
  <desc id="desc">A blue and charcoal abstract creative used to demonstrate placement cropping.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#102b58"/>
      <stop offset="1" stop-color="#0b6be8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="945" cy="260" r="360" fill="#5ca8ff" opacity="0.34" filter="url(#blur)"/>
  <circle cx="120" cy="1590" r="400" fill="#09101d" opacity="0.72" filter="url(#blur)"/>
  <path d="M-90 1190C250 920 450 1010 690 790s400-170 520-40v510c-210-160-370-140-590 80s-480 230-710 80z" fill="#67a8ff" opacity="0.18"/>
  <g transform="translate(108 160)">
    <rect width="176" height="54" rx="27" fill="#ffffff" opacity="0.16"/>
    <circle cx="32" cy="27" r="9" fill="#74b9ff"/>
    <text x="55" y="35" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2">DEMO</text>
  </g>
  <text x="108" y="520" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="800" letter-spacing="-5">
    <tspan x="108">YOUR</tspan><tspan x="108" dy="112">CREATIVE</tspan>
  </text>
  <text x="112" y="790" fill="#b9d9ff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="500">Upload an image or video to begin.</text>
  <g transform="translate(108 1060)">
    <rect width="864" height="460" rx="56" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <rect x="54" y="54" width="278" height="352" rx="32" fill="#0a1527" opacity="0.72"/>
    <rect x="374" y="68" width="380" height="34" rx="17" fill="#ffffff" opacity="0.87"/>
    <rect x="374" y="130" width="286" height="23" rx="12" fill="#ffffff" opacity="0.38"/>
    <rect x="374" y="194" width="420" height="130" rx="24" fill="#ffffff" opacity="0.11"/>
    <rect x="374" y="350" width="196" height="46" rx="23" fill="#74b9ff"/>
  </g>
  <g transform="translate(108 1720)">
    <line x1="0" y1="0" x2="864" y2="0" stroke="#ffffff" stroke-opacity="0.25"/>
    <text y="72" fill="#ffffff" opacity="0.72" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4">9:16 DEMO - 1080 × 1920</text>
